name: Publish

# Tag-driven, so a release is a deliberate act: push `v0.1.0` and this
# publishes that version. n8n only verifies community nodes published from
# GitHub Actions with provenance, which is what Trusted Publishing gives.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/n8n-nodes-deliverd
    permissions:
      contents: read
      # Trusted Publishing: npm verifies a short-lived OIDC token against the
      # publisher configured on the package's settings page, so no npm token is
      # stored anywhere. Configure it once under the package → Settings →
      # Trusted Publisher: deliverd-dev/n8n-nodes-deliverd, workflow
      # publish.yml, environment npm.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs a newer npm than the one Node 22 bundles.
      - run: npm install --global npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: The tag and the version must agree
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag says $TAG, package.json says $VERSION."
            exit 1
          fi

      - name: Show what will be published
        run: npm pack --dry-run

      - run: npm publish --provenance --access public
